<!doctype html>
<html lang="ur-Latn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2C1E16">
  <meta name="description" content="Roshni Lite — halat dekh kar chhote qadam wali daily coaching app">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Roshni Lite">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Roshni Lite</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <h1>Roshni Lite</h1>
          <p>Halat dekh kar, chhota qadam</p>
        </div>
        <button class="btn btn-accent btn-sm" data-action="open-sheet" data-sheet="naya">+ Naya</button>
      </div>
      <div class="pills" id="pills"></div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Waqt"></nav>
    <main id="view" role="tabpanel" aria-live="off"></main>
  </div>

  <footer class="bar">
    <div class="bar-inner">
      <button class="btn btn-ghost btn-lg" id="btn-back" data-action="back">Back</button>
      <span class="bar-pos" id="bar-pos"></span>
      <button class="btn btn-dark btn-lg" id="btn-next" data-action="next">Next</button>
    </div>
  </footer>

  <div id="scrim" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden>
    <div class="grip"></div>
    <div id="sheet-body"></div>
  </section>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:24px">Roshni Lite chalane ke liye JavaScript zaroori hai.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
